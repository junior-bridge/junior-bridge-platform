services:
    backend:
        build:
            context: ./backend
        env_file:
            - .env
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
        command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
        depends_on:
            postgres:
                condition: service_healthy
            mongodb:
                condition: service_started
            redis:
                condition: service_healthy

    frontend:
        build:
            context: ./frontend
            args:
                - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
        ports:
            - "3000:3000"
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - /app/.next
        depends_on:
            - backend

    postgres:
        image: postgres:17
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - postgres_data_junior_bridge:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 5s
            timeout: 5s
            retries: 5

    mongodb:
        image: mongo:8
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data_junior_bridge:/data/db

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - redis_data_junior_bridge:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data_junior_bridge:
    mongodb_data_junior_bridge:
    redis_data_junior_bridge:
