services:
    backend:
        build:
            context: ./backend
        env_file:
            - .env
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
        depends_on:
            - postgres
            - mongodb

    frontend:
        build:
            context: ./frontend
        ports:
            - "3000:3000"
        depends_on:
            - backend

    postgres:
        image: postgres:17
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - postgres_data_junior_bridge:/var/lib/postgresql/data

    mongodb:
        image: mongo:8
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data_junior_bridge:/data/db

volumes:
    postgres_data_junior_bridge:
    mongodb_data_junior_bridge:
