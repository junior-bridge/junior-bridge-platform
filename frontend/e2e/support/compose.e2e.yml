services:
  postgres:
    image: postgres:17
    networks: [data]
    environment:
      POSTGRES_DB: juniorbridge_e2e
      POSTGRES_USER: juniorbridge_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?Use el env-file E2E externo}
    volumes:
      - postgres_e2e:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U juniorbridge_e2e -d juniorbridge_e2e]
      interval: 3s
      timeout: 3s
      retries: 30
  mongodb:
    image: mongo:8
    networks: [data]
    volumes:
      - mongo_e2e:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping')"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ../../../backend
    networks: [data, web]
    environment:
      DJANGO_SETTINGS_MODULE: e2e_settings
      PYTHONPATH: /e2e:/app
      E2E_ISOLATED: juniorbridge_e2e
      E2E_STACK: ${E2E_STACK:?Use el env-file E2E externo}
      SECRET_KEY: ${E2E_SECRET_KEY:?Use el env-file E2E externo}
      DEBUG: "true"
      POSTGRES_DB: juniorbridge_e2e
      POSTGRES_USER: juniorbridge_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DATABASE: juniorbridge_e2e
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://127.0.0.1:${E2E_FRONTEND_PORT:-3107}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${E2E_FRONTEND_PORT:-3107}
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:${E2E_FRONTEND_PORT:-3107}
      EMAIL_HOST: ""
      AWS_STORAGE_BUCKET_NAME: ""
      PAGESPEED_API_KEY: ""
    volumes:
      - ./backend:/e2e:ro
    ports:
      - "127.0.0.1:${E2E_BACKEND_PORT:-8107}:8000"
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
  frontend:
    networks: [web]
    build:
      context: ../../../frontend
      dockerfile: e2e/support/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://127.0.0.1:${E2E_BACKEND_PORT:-8107}
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:${E2E_BACKEND_PORT:-8107}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${E2E_FRONTEND_PORT:-3107}:3000"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 20s
      retries: 40
      start_period: 30s
networks:
  data:
    internal: true
  web:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
volumes:
  postgres_e2e:
  mongo_e2e:
